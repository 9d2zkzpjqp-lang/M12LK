<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe-LK – Musterlösungen</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #0b6f9f;
      --accent-hover: #095c84;
      --shadow: 0 8px 22px rgba(0,0,0,.06);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
    header { margin-bottom: 18px; }
    h1 { font-size: clamp(1.6rem, 2.5vw, 2.4rem); margin: 0 0 6px; }
    .subtitle { margin: 0; color: var(--muted); font-size: .98rem; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 24px; }
    button {
      appearance: none;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: .98rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .accordion { display: grid; gap: 14px; }
    .accordion-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .accordion-item summary {
      list-style: none;
      cursor: pointer;
      padding: 16px 18px;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .accordion-item summary::-webkit-details-marker { display: none; }
    .accordion-item summary::after { content: '▾'; margin-left: auto; color: var(--muted); font-size: 1rem; }
    .accordion-item[open] summary::after { transform: rotate(180deg); }
    .accordion-content { padding: 0 18px 18px; border-top: 1px solid var(--border); overflow-x: auto; }
    .accordion-content img { display: block; width: 100%; height: auto; margin-top: 16px; border-radius: 10px; background: #fff; }
    @media (max-width: 640px) {
      .container { padding: 16px 12px 28px; }
      .controls { display: grid; grid-template-columns: 1fr; }
      button { width: 100%; }
      .accordion-item summary { padding: 14px 15px; font-size: 1rem; }
      .accordion-content { padding: 0 10px 10px; }
    }
  </style>
</head>
